<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="960" height="220" role="img" aria-label="WebFitYou method in five steps: Frame, Design, Activate, Measure, Transmit">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 600; fill: #0d0d0d; text-anchor: middle; }
    .d { font-size: 13px; fill: #6e6e80; text-anchor: middle; }
    .k { font-size: 14px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="219" rx="20" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="t" x="40" y="46" font-size="13" letter-spacing="2" fill="#6e6e80">THE METHOD</text>

  <line x1="112" y1="98" x2="848" y2="98" stroke="#e5e5e5" stroke-width="2"/>

  <circle cx="112" cy="98" r="18" fill="#0d0d0d"/><text class="t k" x="112" y="103">1</text>
  <circle cx="296" cy="98" r="18" fill="#0d0d0d"/><text class="t k" x="296" y="103">2</text>
  <circle cx="480" cy="98" r="18" fill="#0d0d0d"/><text class="t k" x="480" y="103">3</text>
  <circle cx="664" cy="98" r="18" fill="#0d0d0d"/><text class="t k" x="664" y="103">4</text>
  <circle cx="848" cy="98" r="18" fill="#2563eb"/><text class="t k" x="848" y="103">5</text>

  <text class="t h" x="112" y="144">Frame</text><text class="t d" x="112" y="166">Goals and audit</text>
  <text class="t h" x="296" y="144">Design</text><text class="t d" x="296" y="166">Site and content</text>
  <text class="t h" x="480" y="144">Activate</text><text class="t d" x="480" y="166">SEO · GEO · Ads</text>
  <text class="t h" x="664" y="144">Measure</text><text class="t d" x="664" y="166">Data and reports</text>
  <text class="t h" x="848" y="144">Transmit</text><text class="t d" x="848" y="166">You know why it works</text>

  <text class="t" x="480" y="198" font-size="13" fill="#6e6e80" text-anchor="middle">AI speeds up the work. Decisions stay human.</text>
