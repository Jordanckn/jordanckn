    .d { font-size: 13px; fill: #6e6e80; }
    .n { font-size: 11px; fill: #2563eb; letter-spacing: 1px; }
    .c { fill: #f7f7f8; stroke: #e5e5e5; }
  </style>
  <rect x="0.5" y="0.5" width="959" height="409" rx="20" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="t" x="40" y="46" font-size="13" letter-spacing="2" fill="#6e6e80">WHAT WE RUN</text>

  <!-- row 1 -->
  <rect class="c" x="40"  y="70" width="205" height="90" rx="14"/>
