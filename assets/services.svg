  <text class="t n" x="285" y="200">06</text><text class="t h" x="285" y="224">Social media</text><text class="t d" x="285" y="246">Strategy and publishing</text>
  <rect class="c" x="490" y="176" width="205" height="90" rx="14"/>
  <text class="t n" x="510" y="200">07</text><text class="t h" x="510" y="224">Websites</text><text class="t d" x="510" y="246">Design and build</text>
