  <rect class="c" x="40"  y="176" width="205" height="90" rx="14"/>
  <text class="t n" x="60" y="200">05</text><text class="t h" x="60" y="224">ChatGPT Ads</text><text class="t d" x="60" y="246">OpenAI Ads Manager</text>
