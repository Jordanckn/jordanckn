  <rect class="c" x="265" y="70" width="205" height="90" rx="14"/>
  <text class="t n" x="285" y="94">02</text><text class="t h" x="285" y="118">GEO</text><text class="t d" x="285" y="140">AI answer engines</text>
  <rect class="c" x="490" y="70" width="205" height="90" rx="14"/>
  <text class="t n" x="510" y="94">03</text><text class="t h" x="510" y="118">Google Ads</text><text class="t d" x="510" y="140">Search campaigns</text>
  <rect class="c" x="715" y="70" width="205" height="90" rx="14"/>
  <text class="t n" x="735" y="94">04</text><text class="t h" x="735" y="118">Meta Ads</text><text class="t d" x="735" y="140">Facebook · Instagram</text>

