<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-label="AI in production: models such as Claude, Mythos, Hermes, OpenClaw and Grok power chat bots, ElevenLabs voice agents and phone-calling agents, connected to CRM and lead generation through an automation layer">
  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 16px; font-weight: 600; fill: #0d0d0d; }
    .s { font-size: 12px; fill: #2563eb; letter-spacing: 1px; }
    .d { font-size: 14px; fill: #3c3c43; }
    .b { fill: #f7f7f8; stroke: #e5e5e5; }
    .a { stroke: #0d0d0d; stroke-width: 1.5; fill: none; }
  
    .flow { stroke-dasharray: 6 6; animation: dash 1.2s linear infinite; }
    @keyframes dash { to { stroke-dashoffset: -12; } }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.5); opacity: .6; } }
    @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#0d0d0d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="429" rx="20" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="t" x="40" y="42" font-size="13" letter-spacing="2" fill="#6e6e80">AI IN PRODUCTION</text>

  <!-- Models -->
  <rect class="b" x="40" y="70" width="230" height="250" rx="14"/>
  <text class="t s" x="62" y="100">MODELS</text>
  <text class="t h" x="62" y="126">The brains</text>
  <text class="t d" x="62" y="160">Claude</text>
  <text class="t d" x="62" y="188">Claude Mythos</text>
  <text class="t d" x="62" y="216">Hermes</text>
  <text class="t d" x="62" y="244">OpenClaw · Manus</text>
  <text class="t d" x="62" y="272">Grok</text>
  <text class="t d" x="62" y="300">ChatGPT · Codex</text>

  <!-- Agents -->
  <rect class="b" x="320" y="70" width="320" height="250" rx="14"/>
  <text class="t s" x="342" y="100">AGENTS AND BOTS</text>
  <text class="t h" x="342" y="126">The workforce</text>
  <text class="t d" x="342" y="160">Chat and messaging bots</text>
  <text class="t d" x="342" y="188">Voice agents with ElevenLabs</text>
  <text class="t d" x="342" y="216">Phone-calling agents</text>
  <text class="t d" x="342" y="244">Content and social media agents</text>
  <text class="t d" x="342" y="272">Lead qualification agents</text>
  <text class="t d" x="342" y="300">Human validation on sensitive actions</text>

  <!-- Business systems -->
  <rect class="b" x="690" y="70" width="230" height="250" rx="14"/>
  <text class="t s" x="712" y="100">BUSINESS SYSTEMS</text>
  <text class="t h" x="712" y="126">The results</text>
  <text class="t d" x="712" y="160">Custom CRM</text>
  <text class="t d" x="712" y="188">Lead generation</text>
  <text class="t d" x="712" y="216">Appointments booked</text>
  <text class="t d" x="712" y="244">Calendar and billing</text>
  <text class="t d" x="712" y="272">Follow-up and reminders</text>
  <text class="t d" x="712" y="300">Automatic reporting</text>

  <line class="a flow" x1="272" y1="195" x2="318" y2="195" marker-end="url(#ar)"/>
  <line class="a flow" x1="642" y1="195" x2="688" y2="195" marker-end="url(#ar)"/>

  <!-- automation layer -->
  <rect x="40" y="350" width="880" height="56" rx="14" fill="#0d0d0d"/>
  <circle class="pulse" cx="68" cy="378" r="5" fill="#2563eb"/>
  <text class="t" x="86" y="383" font-size="15" font-weight="600" fill="#ffffff">Automation layer</text>
  <text class="t" x="260" y="383" font-size="14" fill="#c5c5d2">n8n  ·  MCP servers  ·  API integrations  ·  Supabase</text>
</svg>
